# Brings the Supabase database up to date automatically (ADR-077).
# On every push that touches the database, the schema is first verified on a
# throwaway local Postgres (supabase/tests/verify_local.sh). Only if that passes,
# supabase/update-to-latest.sql is applied to the real database. The file is
# idempotent, so running it again never hurts.
#
# One-time setup: repository secret SUPABASE_DB_URL with the "Session pooler"
# connection string from Supabase (Connect button), password filled in.
# Without the secret the workflow only verifies and skips the update.
# Optional: SUPABASE_ACCESS_TOKEN, SUPABASE_PROJECT_REF and ANTHROPIC_API_KEY deploy the
# company-writer Edge Function with Claude (ADR-091).
name: Supabase-Datenbank aktualisieren

on:
  push:
    branches: [main, "claude/new-session-mo9j2u"]
    paths:
      - "supabase/**"
      - "src/config/balance.ts"
      - "scripts/apply-updates.sh"
      - ".github/workflows/supabase-update.yml"
  workflow_dispatch:

concurrency:
  group: supabase-update
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  update:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - name: PostgreSQL 16 for the local check
        run: |
          if [ ! -x /usr/lib/postgresql/16/bin/initdb ]; then
            sudo apt-get update
            sudo apt-get install -y postgresql-16
          fi

      - name: Verify schema, RLS and seeds on a throwaway database
        run: bash supabase/tests/verify_local.sh

      - name: Apply new updates to Supabase
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          if [ -z "$SUPABASE_DB_URL" ]; then
            echo "::warning::Secret SUPABASE_DB_URL fehlt – geprüft, aber nichts eingespielt."
            exit 0
          fi
          # Only the update files that are new for this database, each in its own short transaction (ADR-116).
          NEXA_DB_URL="$SUPABASE_DB_URL" bash scripts/apply-updates.sh

      # Optional (ADR-091): the company-writer Edge Function lets Claude write product-fitting company news.
      # Needs the repository secrets SUPABASE_ACCESS_TOKEN and SUPABASE_PROJECT_REF; ANTHROPIC_API_KEY turns the AI on.
      # Without them this step is skipped and the game uses its built-in text generator.
      - name: Deploy Edge Functions (optional)
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ] || [ -z "$SUPABASE_PROJECT_REF" ]; then
            echo "::notice::Edge Functions übersprungen: SUPABASE_ACCESS_TOKEN oder SUPABASE_PROJECT_REF fehlt."
            exit 0
          fi
          npx --yes supabase@2.122.0 functions deploy company-writer --project-ref "$SUPABASE_PROJECT_REF"
          # ADR-132: Claude judges own strategies of founders
          npx --yes supabase@2.122.0 functions deploy strategy-judge --project-ref "$SUPABASE_PROJECT_REF"
          if [ -n "$ANTHROPIC_API_KEY" ]; then
            # The key goes through a private temp file, never through the command line or the log.
            umask 077
            printf 'ANTHROPIC_API_KEY=%s\n' "$ANTHROPIC_API_KEY" > "$RUNNER_TEMP/functions.env"
            npx --yes supabase@2.122.0 secrets set --env-file "$RUNNER_TEMP/functions.env" --project-ref "$SUPABASE_PROJECT_REF"
            rm -f "$RUNNER_TEMP/functions.env"
          fi
          echo "Edge Functions sind auf dem neuesten Stand."
