<!doctype html>
<html lang="de">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>NEXA · Offline</title>
    <style>
      html { background: #0a0c10; color: #f3f5f8; font-family: ui-sans-serif, system-ui, sans-serif; }
      body { min-height: 100dvh; margin: 0; display: grid; place-items: center; text-align: center; padding: 24px; }
      h1 { font-family: ui-monospace, monospace; font-size: 18px; letter-spacing: 0.08em; text-transform: uppercase; }
      p { color: #a9b0be; max-width: 320px; line-height: 1.5; }
      button { margin-top: 16px; height: 44px; padding: 0 20px; border: 0; border-radius: 12px; background: #6a54f0; color: #fff; font: inherit; font-weight: 600; }
    </style>
  </head>
  <body>
    <main>
      <h1>Keine Verbindung</h1>
      <p>Die Börse braucht eine Internetverbindung. Dein Grundeinkommen und deine Firma laufen währenddessen weiter.</p>
      <button onclick="location.reload()">Erneut versuchen</button>
    </main>
  </body>
</html>
